[project]
name = "proteus-mcp"
version = "1.0.0"
description = "MCP server for Proteus 8.6: read and edit schematics, build 8086 firmware, drive the simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pywinauto>=0.6.8",
    "pywin32>=306",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
proteus-mcp = "proteus_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteus_mcp"]

# An installed server (uvx, pip) has no repo around it: ship the assembler and the quirks notes inside it.
[tool.hatch.build.targets.wheel.force-include]
"tools/masm" = "proteus_mcp/tools/masm"
"docs/QUIRKS.md" = "proteus_mcp/QUIRKS.md"

[tool.hatch.build.targets.sdist]
include = ["src", "tools", "docs", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "proteus-mcp"
version = "0.1.0"
description = "MCP server for Proteus 8.6: read and edit schematics, build 8086 firmware, drive the simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "pywinauto>=0.6.8",
    "pywin32>=306",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
proteus-mcp = "proteus_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteus_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

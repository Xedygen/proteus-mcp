[project]
name = "proteus-mcp"
version = "1.0.0"
description = "MCP server for Proteus 8.6: read and edit schematics, build 8086 firmware, drive the simulator"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xedygen" }]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "mcp>=2.3,<3",
    "pywinauto>=0.6.8",
    "pywin32>=306",
    "pillow>=10",
]

[project.urls]
Repository = "https://github.com/Xedygen/proteus-mcp"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
proteus-mcp = "proteus_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteus_mcp"]

# An installed server (uvx, pip) has no repo around it: ship the quirks notes inside it.
[tool.hatch.build.targets.wheel.force-include]
"docs/QUIRKS.md" = "proteus_mcp/QUIRKS.md"

[tool.hatch.build.targets.sdist]
include = ["src", "docs", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
